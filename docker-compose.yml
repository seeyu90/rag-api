services:
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      - .env
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333" # API 端點
      - "6334:6334" # gRPC 端點
    volumes:
      - ./qdrant_data:/qdrant/storage
